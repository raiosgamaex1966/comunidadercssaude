<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Gradiente de Fundo Premium -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04140c" />
      <stop offset="45%" stop-color="#072316" />
      <stop offset="100%" stop-color="#020a06" />
    </linearGradient>

    <!-- Gradiente do Badge RCS -->
    <linearGradient id="rcsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#056138" />
    </linearGradient>

    <!-- Gradiente de Texto e Acentos -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Luzes Radiais de Fundo -->
    <radialGradient id="glowTop" cx="50%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#072316" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowCorner" cx="10%" cy="90%" r="40%">
      <stop offset="0%" stop-color="#059669" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#04140c" stop-opacity="0" />
    </radialGradient>

    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="badgeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#10b981" flood-opacity="0.45" />
    </filter>
  </defs>

  <style>
    .title-font { font-family: 'DM Serif Display', Georgia, serif; }
    .sans-font { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
  </style>

  <!-- Fundo -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />
  <rect width="1200" height="630" fill="url(#glowTop)" />
  <rect width="1200" height="630" fill="url(#glowCorner)" />

  <!-- Padrão Geométrico Suave -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1.5">
    <line x1="150" y1="0" x2="150" y2="630" />
    <line x1="350" y1="0" x2="350" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="850" y1="0" x2="850" y2="630" />
    <line x1="1050" y1="0" x2="1050" y2="630" />
    <line x1="0" y1="130" x2="1200" y2="130" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="500" x2="1200" y2="500" />
  </g>

  <!-- Borda Decorativa com cantos suaves -->
  <rect x="25" y="25" width="1150" height="580" rx="32" fill="none" stroke="#10b981" stroke-opacity="0.25" stroke-width="2" />

  <!-- CONTEÚDO CENTRALIZADO (Para ficar perfeito tanto em formato banner quanto no recorte quadrado do WhatsApp) -->

  <!-- 1. BADGE OFICIAL RCS (Grande e destacado) -->
  <g transform="translate(600, 115)">
    <!-- Círculo de Brilho de Fundo -->
    <rect x="-65" y="-35" width="130" height="90" rx="26" fill="url(#rcsGrad)" filter="url(#badgeGlow)" stroke="#34d399" stroke-width="2.5" />
    
    <!-- Texto RCS em destaque -->
    <text x="0" y="22" text-anchor="middle" class="sans-font" font-size="44" font-weight="900" fill="#ffffff" letter-spacing="3">
      RCS
    </text>

    <!-- Coração / Eletrocardiograma decorativo no topo do badge -->
    <g transform="translate(-16, -26) scale(0.65)" stroke="#ffffff" fill="none" stroke-width="3">
      <path d="M24 37s-14-9-14-18.5C10 12.5 13.5 9 18 9c2.8 0 4.8 1.5 6 3.5 1.2-2 3.2-3.5 6-3.5 4.5 0 8 3.5 8 9.5C38 28 24 37 24 37z" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M14 22h5l2.5-5 3 10 2.5-5H34" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- 2. TAG SUPERIOR: CONCURSOS DA SAÚDE -->
  <g transform="translate(600, 215)">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="-160" cy="0" r="4" fill="#34d399" />
    <text x="5" y="5" text-anchor="middle" class="sans-font" font-size="13" font-weight="800" fill="#a7f3d0" letter-spacing="3.5">
      PLATAFORMA PARA CONCURSOS DA SAÚDE
    </text>
  </g>

  <!-- 3. TÍTULO PRINCIPAL: COMUNIDADE SAÚDE RCS -->
  <text x="600" y="295" text-anchor="middle" class="title-font" font-size="56" font-weight="700" fill="#ffffff" letter-spacing="-0.5">
    Comunidade Saúde RCS
  </text>

  <!-- 4. SUBTÍTULO DAS CARREIRAS -->
  <text x="600" y="355" text-anchor="middle" class="sans-font" font-size="24" font-weight="700" fill="url(#goldGrad)" letter-spacing="2">
    ENFERMAGEM  •  TÉCNICO DE ENFERMAGEM  •  RADIOLOGIA MÉDICA
  </text>

  <!-- 5. DESCRIÇÃO DE RECURSOS -->
  <text x="600" y="405" text-anchor="middle" class="sans-font" font-size="19" font-weight="400" fill="#d1fae5" opacity="0.9">
    Cursos Completos por Edital • Mentorias ao Vivo • Simulados do SUS • Podcasts de Revisão
  </text>

  <!-- 6. BADGES DE CARACTERÍSTICAS EM CAIXINHAS -->
  <g transform="translate(600, 470)">
    <!-- Item 1: Edital & Banca -->
    <g transform="translate(-360, -22)">
      <rect width="220" height="46" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2" />
      <text x="110" y="28" text-anchor="middle" class="sans-font" font-size="14" font-weight="700" fill="#ffffff">
        🎯 Plano por Edital
      </text>
    </g>

    <!-- Item 2: Mentorias -->
    <g transform="translate(-115, -22)">
      <rect width="230" height="46" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2" />
      <text x="115" y="28" text-anchor="middle" class="sans-font" font-size="14" font-weight="700" fill="#ffffff">
        👥 Mentorias ao Vivo
      </text>
    </g>

    <!-- Item 3: Comunidade -->
    <g transform="translate(145, -22)">
      <rect width="220" height="46" rx="14" fill="#ffffff" fill-opacity="0.08" stroke="#10b981" stroke-opacity="0.3" stroke-width="1.2" />
      <text x="110" y="28" text-anchor="middle" class="sans-font" font-size="14" font-weight="700" fill="#ffffff">
        💬 Comunidade Ativa
      </text>
    </g>
  </g>

  <!-- 7. RODAPÉ COM DOMÍNIO E SELO OFICIAL -->
  <g transform="translate(600, 560)">
    <text x="0" y="0" text-anchor="middle" class="sans-font" font-size="14" font-weight="600" fill="#6ee7b7" opacity="0.95" letter-spacing="1">
      comunidadercssaude.vercel.app  •  Acesso Oficial
    </text>
  </g>
</svg>
